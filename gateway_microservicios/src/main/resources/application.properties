spring.application.name=gateway-microservicios
server.port=8090

# URL del Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Habilitar descubrimiento automático de rutas desde Eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Configuración de CORS
spring.cloud.gateway.server.webflux.routes[0].id=usuarios-microservicios
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios-microservicios
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/alumnos/**

spring.cloud.gateway.server.webflux.routes[1].id=curso-microservicios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://curso-microservicios
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cursos/**

spring.cloud.gateway.server.webflux.routes[2].id=examenes-microservicios
spring.cloud.gateway.server.webflux.routes[2].uri=lb://examenes-microservicios
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/examenes/**

spring.cloud.gateway.server.webflux.routes[3].id=respuestas-microservicios
spring.cloud.gateway.server.webflux.routes[3].uri=lb://respuestas-microservicios
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/respuestas/**

spring.cloud.loadbalancer.ribbon.enabled=false
spring.application.name=examenes-microservicios

server.port=${PORT:0}

# Configuración Eureka recomendada para puertos dinámicos / locales
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuración de Database
spring.datasource.url=${DB_PS_URL_MS}
spring.datasource.username=${DB_PS_USERNAME_MS}
spring.datasource.password=${DB_PS_PASSWORD_MS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug